[metadata]
name = mujoco-runtime-control
version = 0.6.0
description = Reusable MuJoCo browser control, terrain composition and sim-to-sim tools
long_description = file: README.md
long_description_content_type = text/markdown

[options]
python_requires = >=3.8
packages = find:
package_dir =
    = src
install_requires =
    mujoco>=2.3
    numpy>=1.20
    Pillow>=8
    onnxruntime>=1.16
    PyYAML>=6
include_package_data = True

[options.packages.find]
where = src

[options.extras_require]
test =
    pytest>=7
speech =
    SpeechRecognition>=3.10
    PyAudio>=0.2.14

[options.package_data]
runtime_control =
    example_runtime_config.yaml
    maps/*.xml
    maps/*.txt
    maps/*.md
    maps/*.py
    maps/imgs/*.png
    maps/barkour_assets/*.stl
    maps/barkour_assets/*.png
